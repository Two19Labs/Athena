<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2318181b%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2717%27 font-family=%27Arial%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EA%3C/text%3E%3C/svg%3E">
  <title>Looms Master · APLYD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="js/theme.js"></script>
</head>
<body class="app-shell" data-page="machines">
  <aside class="sidebar" id="appSidebar"></aside>

  <div class="content-shell">
    <header class="topbar">
      <div>
        <p class="page-eyebrow">Master data</p>
        <h2 class="page-title">Looms Master</h2>
      </div>
      <div class="topbar-actions"></div>
    </header>

    <main class="content-main">
      <div id="demoPersonaBar" class="demo-persona-bar"></div>

      <section class="hero-panel">
        <div>
          <h3>Registered looms</h3>
          <p class="muted">The AI's loom reading is matched against this list. The expected range drives the "check for a misread digit" warning during review.</p>
        </div>
        <button id="openMachineModalBtn" class="btn btn-primary" type="button">+ Add loom</button>
      </section>

      <div class="table-card">
        <table class="data-table">
          <thead><tr><th>Code</th><th>Name</th><th>Type</th><th class="num">Expected range</th><th>Notes</th><th>Status</th><th></th></tr></thead>
          <tbody id="machinesTableBody"></tbody>
        </table>
      </div>

      <div id="machineModal" class="modal-overlay hidden">
        <form class="modal-box modal-box-sm" id="machineForm" role="dialog" aria-modal="true" aria-labelledby="machineModalTitle" novalidate>
          <div class="modal-head">
            <h3 id="machineModalTitle">Add loom</h3>
            <button type="button" class="btn btn-outline btn-small" data-close aria-label="Close">✕</button>
          </div>
          <input type="hidden" id="machineId">
          <div class="form-grid">
            <label>Loom code <span class="req">*</span><input type="text" id="machineCode" class="form-control" placeholder="L-13" required></label>
            <label>Type<select id="machineType" class="select-control"><option>Air-Jet</option><option>Rapier</option><option>Shuttle</option><option>Water-Jet</option><option>Projectile</option></select></label>
            <label class="span-2">Name <span class="req">*</span><input type="text" id="machineName" class="form-control" placeholder="Loom 13 (Air-Jet)" required></label>
            <label>Expected min (m/shift)<input type="number" id="machineMinQty" class="form-control" min="0" step="1"></label>
            <label>Expected max (m/shift)<input type="number" id="machineMaxQty" class="form-control" min="1" step="1"></label>
            <label class="span-2">Notes<input type="text" id="machineNotes" class="form-control" placeholder="Shed A · Combed Poplin"></label>
            <label class="check span-2"><input type="checkbox" id="machineIsActive" checked> Active</label>
          </div>
          <p id="machineFormError" class="field-msg bad hidden" role="alert"></p>
          <div class="modal-foot">
            <button type="button" class="btn btn-outline" data-close>Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveMachineBtn">Save loom</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/security.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/master-data.js"></script>
</body>
</html>
