<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#18181b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="APLYD">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2318181b%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2717%27 font-family=%27Arial%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EA%3C/text%3E%3C/svg%3E">
  <title>Production Register · APLYD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="js/theme.js"></script>
</head>
<body class="app-shell" data-page="register">
  <aside class="sidebar" id="appSidebar"></aside>

  <div class="content-shell">
    <header class="topbar">
      <div>
        <p class="page-eyebrow">Ledger &amp; ERP handoff</p>
        <h2 class="page-title">Production Register</h2>
      </div>
      <div class="topbar-actions"></div>
    </header>

    <main class="content-main">
      <div id="demoPersonaBar" class="demo-persona-bar"></div>

      <div class="filter-bar collapsible" id="registerFilters">
        <button type="button" class="btn btn-outline filters-toggle show-phone" id="filtersToggle" aria-expanded="false" aria-controls="registerFilters">Filters &amp; export</button>
        <input id="searchRecords" class="form-control" type="search" placeholder="Search record #, loom, sort or batch" aria-label="Search">
        <select id="filterMachineSelect" class="select-control" aria-label="Loom"></select>
        <select id="filterShiftSelect" class="select-control" aria-label="Shift"></select>
        <div class="date-filter">
          <input id="filterDate" class="form-control" type="date" aria-label="Date">
          <button id="clearDateBtn" class="btn btn-outline btn-small" type="button" aria-label="Clear date">✕</button>
        </div>
        <div class="btn-row">
          <button id="exportCsvBtn" class="btn btn-outline" type="button">Export CSV</button>
          <button id="exportJsonBtn" class="btn btn-outline" type="button" title="Approved records in the ERP payload format">Export ERP JSON</button>
        </div>
      </div>

      <div class="tabs-row">
        <div class="tab-strip" role="tablist">
          <button class="tab-button tab-button-active" data-status="all" type="button" role="tab" aria-selected="true">All</button>
          <button class="tab-button" data-status="approved" type="button" role="tab" aria-selected="false">Approved</button>
          <button class="tab-button" data-status="pending_review" type="button" role="tab" aria-selected="false">Pending</button>
          <button class="tab-button" data-status="returned_for_correction" type="button" role="tab" aria-selected="false">Returned</button>
          <button class="tab-button" data-status="rejected" type="button" role="tab" aria-selected="false">Rejected</button>
        </div>
        <span id="registerCount" class="muted small"></span>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr><th>Record</th><th>Date</th><th>Loom</th><th>Shift</th><th class="num">Output</th><th>Material</th><th class="num">Downtime</th><th>Status</th><th>ERP</th></tr>
          </thead>
          <tbody id="registerTableBody"></tbody>
        </table>
      </div>

      <div id="recordModal" class="modal-overlay hidden">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalRecordTitle">
          <div class="modal-head">
            <div>
              <h3 id="modalRecordTitle"></h3>
              <span id="modalStatusBadge"></span>
            </div>
            <button type="button" class="btn btn-outline btn-small" data-close aria-label="Close">✕</button>
          </div>
          <div id="modalErpBox"></div>
          <dl id="modalFields" class="kv-grid"></dl>
          <p class="section-label">Human changes</p>
          <ul id="modalAudit" class="audit-list"></ul>
          <div class="modal-foot">
            <a id="modalReviewLink" href="review.html" class="btn btn-outline">Open with photo →</a>
            <button type="button" class="btn btn-primary" data-close>Close</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/security.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/production-register.js"></script>
</body>
</html>
