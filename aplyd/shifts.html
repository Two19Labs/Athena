<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#18181b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="APLYD">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2318181b%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2717%27 font-family=%27Arial%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EA%3C/text%3E%3C/svg%3E">
  <title>Shift Schedules · APLYD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="js/theme.js"></script>
</head>
<body class="app-shell" data-page="shifts">
  <aside class="sidebar" id="appSidebar"></aside>

  <div class="content-shell">
    <header class="topbar">
      <div>
        <p class="page-eyebrow">Master data</p>
        <h2 class="page-title">Shift Schedules</h2>
      </div>
      <div class="topbar-actions"></div>
    </header>

    <main class="content-main">
      <div id="demoPersonaBar" class="demo-persona-bar"></div>

      <section class="hero-panel">
        <div>
          <h3>Shifts</h3>
          <p class="muted">Handwritten shift entries ("M", "Morning", "Night") are mapped to these codes. Shift length caps the downtime that can be recorded.</p>
        </div>
        <button id="openShiftModalBtn" class="btn btn-primary" type="button">+ Add shift</button>
      </section>

      <div class="table-card">
        <table class="data-table">
          <thead><tr><th>Code</th><th>Name</th><th>Hours</th><th class="num">Length</th><th>Status</th><th></th></tr></thead>
          <tbody id="shiftsTableBody"></tbody>
        </table>
      </div>

      <div id="shiftModal" class="modal-overlay hidden">
        <form class="modal-box modal-box-sm" id="shiftForm" role="dialog" aria-modal="true" aria-labelledby="shiftModalTitle" novalidate>
          <div class="modal-head">
            <h3 id="shiftModalTitle">Add shift</h3>
            <button type="button" class="btn btn-outline btn-small" data-close aria-label="Close">✕</button>
          </div>
          <input type="hidden" id="shiftId">
          <div class="form-grid">
            <label>Code <span class="req">*</span><input type="text" id="shiftCode" class="form-control" placeholder="G" maxlength="3" required></label>
            <label>Name <span class="req">*</span><input type="text" id="shiftName" class="form-control" placeholder="General Shift" required></label>
            <label>Start<input type="time" id="shiftStart" class="form-control" value="06:00"></label>
            <label>End<input type="time" id="shiftEnd" class="form-control" value="14:00"></label>
            <label class="check span-2"><input type="checkbox" id="shiftIsActive" checked> Active</label>
          </div>
          <p id="shiftFormError" class="field-msg bad hidden" role="alert"></p>
          <div class="modal-foot">
            <button type="button" class="btn btn-outline" data-close>Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveShiftBtn">Save shift</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/security.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/master-data.js"></script>
</body>
</html>
