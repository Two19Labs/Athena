<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#18181b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="APLYD">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2318181b%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2717%27 font-family=%27Arial%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EA%3C/text%3E%3C/svg%3E">
  <title>Review Queue · APLYD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="js/theme.js"></script>
</head>
<body class="app-shell" data-page="review">
  <aside class="sidebar" id="appSidebar"></aside>

  <div class="content-shell">
    <header class="topbar">
      <div>
        <p class="page-eyebrow">Human in the loop</p>
        <h2 class="page-title" id="pageTitle">Review Queue</h2>
      </div>
      <div class="topbar-actions"></div>
    </header>

    <main class="content-main">
      <div id="demoPersonaBar" class="demo-persona-bar"></div>

      <!-- Queue -->
      <section id="queueSection" class="hidden">
        <div id="batchBanner" class="inline-alert group-banner hidden"></div>
        <div class="filter-bar">
          <input type="search" id="queueSearchInput" class="form-control" placeholder="Search record #, loom or batch" aria-label="Search">
          <select id="queueStatusFilter" class="select-control" aria-label="Status filter">
            <option value="pending_review">Pending review</option>
            <option value="returned_for_correction">Returned for correction</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="all">All</option>
          </select>
          <select id="queueSort" class="select-control" aria-label="Sort order">
            <option value="oldest">Oldest first</option>
            <option value="newest">Newest first</option>
          </select>
          <a href="capture.html" class="btn btn-primary">+ Capture form</a>
        </div>
        <div class="table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Record</th><th>Date</th><th>Loom</th><th>Shift</th><th class="num">Output</th>
                <th>Needs attention</th><th>Status</th><th></th>
              </tr>
            </thead>
            <tbody id="queueTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- Detail -->
      <section id="detailSection" class="hidden">
        <div class="detail-head">
          <a href="review.html" class="btn btn-outline btn-small">← Queue</a>
          <div class="detail-title">
            <h3 id="detailRecordNumber"></h3>
            <p id="detailRecordMeta" class="muted small"></p>
          </div>
          <span id="detailStatusBadge"></span>
        </div>

        <div id="statusBanner" class="status-banner hidden"></div>
        <div id="groupStrip" class="inline-alert group-banner hidden"></div>

        <div class="review-split-container">
          <div class="document-viewer-card">
            <div class="document-toolbar">
              <span class="small strong hide-phone">Source photo</span>
              <div class="toolbar-actions">
                <button type="button" class="toolbar-btn hide-phone" id="zoomOutBtn" aria-label="Zoom out">−</button>
                <span id="zoomLabel" class="zoom-label hide-phone">100%</span>
                <button type="button" class="toolbar-btn hide-phone" id="zoomInBtn" aria-label="Zoom in">+</button>
                <button type="button" class="toolbar-btn" id="rotateViewBtn" aria-label="Rotate view">⟳</button>
                <button type="button" class="toolbar-btn" id="zoomResetBtn" aria-label="Reset view">↺</button>
                <button type="button" class="toolbar-btn" id="fullscreenBtn" aria-label="Full screen photo" aria-pressed="false">⛶</button>
                <button type="button" class="toolbar-btn show-phone" id="photoToggleBtn" aria-label="Hide photo" aria-pressed="false">▴</button>
              </div>
            </div>
            <div class="canvas-viewport" id="canvasViewport">
              <img id="canvasImg" class="document-img hidden" alt="Photo of the production form" draggable="false">
              <div id="boxHighlight" class="box-highlight hidden" aria-hidden="true"></div>
              <div id="noImageNote" class="no-image-note hidden"></div>
            </div>
            <div class="viewer-foot">
              <span>Drag to pan · Ctrl + scroll, pinch or double-click to zoom · <kbd>?</kbd> shortcuts</span>
              <span id="extractionMeta"></span>
            </div>
            <ul id="imageIssues" class="image-issues hidden"></ul>
          </div>

          <div class="verification-form-card">
            <div id="validationPanel"></div>
            <div id="verificationFieldsContainer"></div>

            <div id="auditTrailContainer" class="audit-block hidden">
              <p class="section-label">Audit trail · append-only</p>
              <div class="table-scroll">
                <table class="data-table data-table-compact">
                  <thead><tr><th>Field</th><th>Action</th><th>Before</th><th>After</th><th>By</th><th>When</th><th>Reason</th></tr></thead>
                  <tbody id="auditTrailList"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div class="sticky-action-bar" id="actionBar"></div>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/security.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/rowsnap.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
